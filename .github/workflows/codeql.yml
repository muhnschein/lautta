name: CodeQL
# Advanced setup: default setup cannot leave paths out. Default setup must be off
# (Settings > Code security) or GitHub refuses the upload.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "23 5 * * 1"
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, rust]
    env:
      # Shipped build: no cfg(test), default features only.
      CODEQL_EXTRACTOR_RUST_OPTION_CARGO_CFG_OVERRIDES: -test
      CODEQL_EXTRACTOR_RUST_OPTION_CARGO_FEATURES: default
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - id: init
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/${{ matrix.language == 'rust' && 'codeql-config-rust.yml' || 'codeql-config.yml' }}
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      # Our query against planted cases.
      - if: matrix.language == 'rust'
        run: '"$CODEQL" test run --additional-packs .github/codeql .github/codeql/rust-queries-tests'
        env:
          CODEQL: ${{ steps.init.outputs.codeql-path }}
