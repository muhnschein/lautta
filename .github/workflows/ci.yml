name: CI
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  SDK_IMAGE: mirror.gcr.io/coderus/sailfishos-platform-sdk-aarch64:5.2.0.15@sha256:e5f7596d14502746b308c3dde36f65fc25d7f76c45a01acaed56a1f55b76f592
  TARGET: SailfishOS-5.2.0.15-aarch64
jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name != 'push' && 2 || 0 }}
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: ./tools/ci/changes.sh >> "$GITHUB_OUTPUT"

  check:
    name: Format, lint, host tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91
        with:
          tool: cargo-nextest@0.9.148
      - name: Install dependencies
        run: ./tools/ci/install-host-deps.sh nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: make check
        run: make check
      - name: Docs-only rule
        run: ./tools/ci/changes-test.sh
      - name: Apt mirror picker
        run: ./tools/ci/apt-install-selftest.sh
      - name: verify-rpm usage
        run: ./tools/ci/verify-rpm-test.sh

  mutation:
    name: Tests bite (mutation check, changed lines)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Diff against the base branch
        id: diff
        run: |
          git diff HEAD^1 HEAD -- $(make -s mutants-paths) > "$RUNNER_TEMP/pr.diff"
          if [ ! -s "$RUNNER_TEMP/pr.diff" ]; then
            echo "No mutated file changed; nothing to check."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91
        if: steps.diff.outputs.changed == 'true'
        with:
          tool: cargo-mutants@25.0.1
      - name: Install dependencies
        if: steps.diff.outputs.changed == 'true'
        run: ./tools/ci/install-host-deps.sh mutants
      - name: Mutation check
        if: steps.diff.outputs.changed == 'true'
        run: make mutants-diff MUTANTS_DIFF="$RUNNER_TEMP/pr.diff"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: mutants-diff
          path: mutants.out/*.txt

  rpm:
    name: Sailfish OS 5.2 aarch64 RPM
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Cross-build tools (i386 C library for the SDK compiler, Rust)
        run: |
          ./tools/ci/apt-install.sh --no-install-recommends libc6-i386
          rustup toolchain install
      - name: Pull the SDK
        run: docker pull "$SDK_IMAGE"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: ". -> prebuilt/target"
          key: rpm-${{ env.TARGET }}
      - name: Build the RPM in the Sailfish SDK
        run: make rpm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: harbour-lautta-aarch64
          path: RPMS/harbour-lautta-*.rpm
      - name: Harbour validator, installability, QML on the target
        run: make check-rpm

  zizmor:
    name: Workflow audit (zizmor, offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91
        with:
          tool: zizmor@1.30.1
      - run: zizmor --offline .github/workflows/

  reproducible:
    name: RPM rebuilds byte for byte
    needs: rpm
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Cross-build tools (i386 C library for the SDK compiler)
        run: ./tools/ci/apt-install.sh --no-install-recommends libc6-i386
      - name: Fetch the RPM job's package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n harbour-lautta-aarch64 --dir "$RUNNER_TEMP/rpms"
      - name: Rebuild and compare
        env:
          TZ: Pacific/Chatham
        run: |
          umask 0002
          CARGO_HOME="$RUNNER_TEMP/cargo" LAUTTA_REPO="$GITHUB_WORKSPACE" \
            ./tools/verify-rpm.sh --ref "$GITHUB_SHA" "$RUNNER_TEMP"/rpms/*.rpm
