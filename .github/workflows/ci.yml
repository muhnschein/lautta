name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
# New push cancels the run in flight on the same branch or pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  # Runner is thrown away: incremental state never read. Off = smaller cache.
  CARGO_INCREMENTAL: 0
  SDK_IMAGE: mirror.gcr.io/coderus/sailfishos-platform-sdk-aarch64:5.2.0.15@sha256:e5f7596d14502746b308c3dde36f65fc25d7f76c45a01acaed56a1f55b76f592
  TARGET: SailfishOS-5.2.0.15-aarch64
jobs:
  # Docs-only pull request: build and test jobs skipped. A job skipped by
  # `if:` passes as a required check. Rules: tools/ci/changes.sh.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 2  # the merge commit and its base parent
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: ./tools/ci/changes.sh >> "$GITHUB_OUTPUT"

  check:
    name: Format, lint, host tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: ./tools/ci/install-host-deps.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: make check
        run: make check
      # Wrong rule = code pull request green without tests.
      - name: Docs-only rule
        run: ./tools/ci/changes-test.sh

  # Pull requests mutate only the lines they change in the mutated files
  # (SPEC TST-5); the whole set runs weekly and whenever the mutation setup
  # changes (mutation.yml).
  mutation:
    name: Tests bite (mutation check, changed lines)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 2  # the merge commit and its base parent
      - name: Diff against the base branch
        id: diff
        run: |
          # HEAD is the PR merged into the current base, so HEAD^1..HEAD is
          # exactly what the PR changes.
          git diff HEAD^1 HEAD -- $(make -s mutants-paths) > "$RUNNER_TEMP/pr.diff"
          if [ ! -s "$RUNNER_TEMP/pr.diff" ]; then
            echo "No mutated file changed; nothing to check."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Prebuilt, same version as install-host-deps.sh: building it takes minutes.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        if: steps.diff.outputs.changed == 'true'
        with:
          tool: cargo-mutants@25.0.1
      - name: Install dependencies
        if: steps.diff.outputs.changed == 'true'
        run: ./tools/ci/install-host-deps.sh mutants
      - name: Mutation check
        if: steps.diff.outputs.changed == 'true'
        run: make mutants-diff MUTANTS_DIFF="$RUNNER_TEMP/pr.diff"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: mutants-diff
          path: mutants.out/*.txt

  rpm:
    name: Sailfish OS 5.2 aarch64 RPM
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: ./tools/ci/install-host-deps.sh cross
      - name: Pull the SDK
        run: docker pull "$SDK_IMAGE"
      # Cross-built dependencies (tools/ci/cross-build.sh's target dir) and
      # crates. Key adds the SDK target: a new sysroot never links old objects.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> prebuilt/target"
          key: rpm-${{ env.TARGET }}
      - name: Build the RPM in the Sailfish SDK
        run: make rpm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harbour-lautta-aarch64
          path: RPMS/harbour-lautta-*.rpm
      # After upload: a package the checks reject is still worth installing.
      - name: Harbour validator, installability, QML on the target
        run: make check-rpm

  # Workflows: `${{ }}` in scripts, tokens left in .git/config, cache trust.
  # Wrongly raised findings: ignored in place, reason beside.
  zizmor:
    name: Workflow audit (zizmor, offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: zizmor@1.30.1
      - run: zizmor --offline .github/workflows/
