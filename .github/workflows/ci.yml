name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  SDK_IMAGE: mirror.gcr.io/coderus/sailfishos-platform-sdk-aarch64:5.2.0.15@sha256:e5f7596d14502746b308c3dde36f65fc25d7f76c45a01acaed56a1f55b76f592
  TARGET: SailfishOS-5.2.0.15-aarch64
jobs:
  check:
    name: Format, lint, host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install dependencies
        run: ./tools/ci/install-host-deps.sh
      - name: make check
        run: make check

  # Pull requests mutate only the lines they change in the mutated files
  # (SPEC TST-5); the whole set runs weekly and whenever the mutation setup
  # changes (mutation.yml).
  mutation:
    name: Tests bite (mutation check, changed lines)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2  # the merge commit and its base parent
      - name: Diff against the base branch
        id: diff
        run: |
          # HEAD is the PR merged into the current base, so HEAD^1..HEAD is
          # exactly what the PR changes.
          git diff HEAD^1 HEAD -- $(make -s mutants-paths) > "$RUNNER_TEMP/pr.diff"
          if [ ! -s "$RUNNER_TEMP/pr.diff" ]; then
            echo "No mutated file changed; nothing to check."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.diff.outputs.changed == 'true'
        run: ./tools/ci/install-host-deps.sh mutants
      - name: Mutation check
        if: steps.diff.outputs.changed == 'true'
        run: make mutants-diff MUTANTS_DIFF="$RUNNER_TEMP/pr.diff"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: mutants-diff
          path: mutants.out/*.txt

  rpm:
    name: Sailfish OS 5.2 aarch64 RPM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install dependencies
        run: ./tools/ci/install-host-deps.sh cross
      - name: Pull the SDK
        run: docker pull "$SDK_IMAGE"
      - name: Build the RPM in the Sailfish SDK
        run: make rpm
      - name: Harbour validator, installability, QML on the target
        run: make check-rpm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harbour-lautta-aarch64
          path: RPMS/harbour-lautta-*.rpm

  # PKG-4: the RPM job's package rebuilt the way doc/VERIFYING.md tells users
  # (tools/verify-rpm.sh): fresh clone, other runner, path, cargo home, time
  # zone, umask and time. Not byte for byte: red.
  reproducible:
    name: RPM rebuilds byte for byte
    needs: rpm
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install dependencies
        run: ./tools/ci/install-host-deps.sh cross
      - name: Fetch the RPM job's package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n harbour-lautta-aarch64 --dir "$RUNNER_TEMP/rpms"
      # The commit from this checkout: a pull request's merge commit is on no
      # branch a fresh clone from GitHub fetches.
      - name: Rebuild and compare
        env:
          TZ: Pacific/Chatham
        run: |
          umask 0002
          CARGO_HOME="$RUNNER_TEMP/cargo" LAUTTA_REPO="$GITHUB_WORKSPACE" \
            ./tools/verify-rpm.sh --ref "$GITHUB_SHA" "$RUNNER_TEMP"/rpms/*.rpm
