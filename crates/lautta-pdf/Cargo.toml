[package]
name = "lautta-pdf"
description = "PDF pages as pixels for the Lautta viewer (hayro, pure Rust, no I/O)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test PDFs built in code, for other crates' tests.
sample = []

[dependencies]
# Pure Rust, no I/O: sees only the bytes given. Standard 14 fonts and CMaps compiled in.
hayro = { version = "0.8", default-features = false, features = ["embed-fonts", "embed-cmaps"] }
