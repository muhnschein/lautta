[package]
name = "harbour-lautta"
description = "Lautta, a file manager for Sailfish OS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }

[[bin]]
name = "harbour-lautta"
path = "src/main.rs"
test = false

[features]
sailfish = ["lautta-qt/sailfish"]

[dependencies]
lautta-qt = { path = "../lautta-qt" }
