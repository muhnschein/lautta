[package]
name = "lautta-bridge-proto"
description = "netvfs bridge (org.netvfs.Bridge1) types, client proxy and a scriptable fake bridge for tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# In-process fake bridge (TST-2) used by tests of this crate and of lautta-core.
fake = []

[dependencies]
zbus = { version = "4", default-features = false, features = ["tokio", "p2p"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
futures = "0.3"
thiserror = "1"
log = "0.4"
zeroize = "1"
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
