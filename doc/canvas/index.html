<style>
/* Layout: sticky bar with views; flows = rows of phone frames scrolling sideways; screens = grid; features = table by area. */
:root {
  --bg: #f3f6f7; --panel: #ffffff; --fg: #12212a; --muted: #5a6d77; --line: #d5dfe3;
  --accent: #00838f; --accent-soft: #d8f0f2; --bridge: #6a4fb3; --bridge-soft: #ebe5f8;
  --warn: #9a5b00; --warn-soft: #fbefd9; --phone: #0b1418; --shadow: rgba(10, 30, 40, .10);
  --font: "Source Sans 3", "Sailfish Sans", system-ui, sans-serif;
  --mono: "Source Code Pro", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1418; --panel: #111d23; --fg: #e3eef1; --muted: #8fa5ae; --line: #22343c;
  --accent: #4fd6e0; --accent-soft: #123239; --bridge: #b49cf5; --bridge-soft: #251d3d;
  --warn: #f0b45c; --warn-soft: #33260f; --phone: #000; --shadow: rgba(0,0,0,.35); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b1418; --panel: #111d23; --fg: #e3eef1; --muted: #8fa5ae; --line: #22343c;
  --accent: #4fd6e0; --accent-soft: #123239; --bridge: #b49cf5; --bridge-soft: #251d3d;
  --warn: #f0b45c; --warn-soft: #33260f; --phone: #000; --shadow: rgba(0,0,0,.35); color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 16px/1.45 var(--font); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
a { color: var(--accent); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font-weight: 300; font-size: 26px; letter-spacing: .01em; color: var(--accent); }
.brand span { color: var(--muted); font-size: 14px; }
nav.views { display: flex; gap: 4px; }
nav.views a { text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 6px; font-weight: 600; }
nav.views a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
nav.views a:focus-visible, button:focus-visible, input:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tools { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
.tools input { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); width: 15rem; max-width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-size: 14px; border: 0; background: transparent; color: var(--muted); padding: 5px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
main { padding-block: 20px 60px; }
.intro { max-width: 70ch; color: var(--muted); margin: 0 0 18px; }
.intro b { color: var(--fg); }
.stats { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 0 0 24px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.stats b { color: var(--fg); font-size: 18px; font-weight: 600; margin-right: 4px; }
h2.group { font-weight: 300; font-size: 22px; color: var(--accent); margin: 34px 0 6px; text-align: right; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.mono { font-family: var(--mono); font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font: 500 12px/1 var(--mono); padding: 4px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); text-decoration: none; white-space: nowrap; cursor: pointer; border: 0; }
.chip.b { background: var(--bridge-soft); color: var(--bridge); }
.chip.w { background: var(--warn-soft); color: var(--warn); }
.chip.plain { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
/* Flows */
.flow { margin: 0 0 30px; scroll-margin-top: 90px; }
.flow-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.flow-head h3 { margin: 0; font-size: 19px; font-weight: 600; }
.flow-head .goal { color: var(--muted); }
.flow .chips { margin: 6px 0 10px; }
.strip { display: flex; gap: 0; overflow-x: auto; padding: 4px 2px 12px; scroll-snap-type: x proximity; }
.step { flex: 0 0 auto; width: 200px; display: flex; flex-direction: column; gap: 6px; scroll-snap-align: start; }
.arrow { flex: 0 0 auto; width: 26px; align-self: flex-start; margin-top: 200px; color: var(--muted); text-align: center; font-size: 18px; }
.phone { width: 200px; aspect-ratio: 1080 / 2280; border-radius: 16px; background: var(--phone); padding: 5px; box-shadow: 0 2px 10px var(--shadow); max-width: 100%; }
.phone img { width: 100%; height: 100%; object-fit: cover; border-radius: 11px; display: block; cursor: zoom-in; }
.phone.none { background: transparent; border: 2px dashed var(--line); box-shadow: none; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); font-size: 14px; padding: 16px; }
.step .cap { font-size: 14px; line-height: 1.3; min-height: 2.6em; }
.step .num { color: var(--muted); font: 12px var(--mono); }
.step.hit .phone { outline: 3px solid var(--accent); outline-offset: 2px; }
/* Screens */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
.scr { display: grid; grid-template-columns: 110px 1fr; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; scroll-margin-top: 90px; min-width: 0; }
.scr .phone { width: 110px; border-radius: 10px; padding: 3px; }
.scr .phone img { border-radius: 8px; }
.scr .phone.none { font-size: 12px; padding: 6px; border-radius: 10px; }
.scr h3 { margin: 0 0 2px; font-size: 16px; font-weight: 600; }
.scr .meta { font-size: 13px; color: var(--muted); display: grid; gap: 3px; min-width: 0; overflow-wrap: anywhere; }
.scr .more { font-size: 12px; color: var(--muted); }
.target { outline: 3px solid var(--accent); outline-offset: 3px; }
/* Features */
.ftable { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
@media (max-width: 760px) { thead { display: none; } table, tbody, tr, td { display: block; } tr.feat { padding: 8px 0; border-bottom: 1px solid var(--line); } table td { border: 0; padding: 4px 0; } td.cov::before { content: "Phone shot: "; color: var(--muted); font-weight: 400; } }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding: 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.id { white-space: nowrap; }
tr.area td { background: transparent; color: var(--accent); font-weight: 300; font-size: 20px; padding-top: 24px; }
tr.feat { scroll-margin-top: 90px; }
td .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
.cov { font: 600 12px var(--mono); white-space: nowrap; }
.cov.y { color: var(--accent); } .cov.n { color: var(--warn); }
.empty { color: var(--muted); padding: 30px 0; }
dialog { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 96vh; }
dialog::backdrop { background: rgba(0,0,0,.75); }
dialog img { max-height: 92vh; max-width: 92vw; border-radius: 14px; display: block; }
dialog p { color: #fff; text-align: center; margin: 8px 0 0; font-size: 14px; }
footer { color: var(--muted); font-size: 13px; padding-block: 0 40px; max-width: 80ch; }
@media (max-width: 600px) { .tools { margin-left: 0; } .step { width: 160px; } .phone { width: 160px; } .arrow { margin-top: 160px; width: 18px; } }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

const isB = m => /B/.test(m || "") && !/S/.test(m || "");
const modeOk = m => mode === "all" || (mode === "B" ? /B/.test(m) : /S/.test(m));
const match = (...xs) => !q || xs.join(" ").toLowerCase().includes(q);
const chipF = id => `<a class="chip${isB(F[id]?.mode) ? " b" : ""}" href="#${id}" title="${esc(F[id]?.name)}">${id}</a>`;
const chipS = id => `<a class="chip plain" href="#${id}" title="${esc(S[id]?.name)}">${id}</a>`;
const chipFL = id => `<a class="chip" href="#${id}" title="${esc(FL[id]?.name)}">${id}</a>`;
const modeChip = m => m === "B" ? '<span class="chip b">bridge</span>' : m === "S/B" ? '<span class="chip plain">both modes</span>' : '<span class="chip plain">standalone</span>';
const img = (shot, alt) => shot ? `<div class="phone"><img decoding="async" src="shots/${shot}.jpg" alt="${esc(alt)}" data-cap="${esc(alt)}"></div>` : `<div class="phone none">Not captured on phone</div>`;

function flows() {
  const groups = [...new Set(DATA.flows.map(f => f.group))];
  let html = `<p class="intro">Every user flow Lautta has, as <b>real screenshots</b> from the test phone. A flow is a goal a person has; each frame is one screen on the way, tagged with its screen ID. Feature chips link to the feature list; screen chips to the screen catalogue.</p>`;
  const shots = DATA.flows.flatMap(f => f.steps).filter(s => s.shot).length;
  const steps = DATA.flows.flatMap(f => f.steps).length;
  html += `<div class="stats"><span><b>${DATA.flows.length}</b>flows</span><span><b>${steps}</b>steps</span><span><b>${shots}</b>shot on phone</span><span><b>${DATA.screens.length}</b>screens</span><span><b>${DATA.features.length}</b>features</span></div>`;
  let n = 0;
  for (const g of groups) {
    const fs = DATA.flows.filter(f => f.group === g && modeOk(f.mode) && match(f.id, f.name, f.goal, f.features.join(" "), f.steps.map(s => s.text + " " + s.screen + " " + (S[s.screen]?.name || "")).join(" ")));
    if (!fs.length) continue;
    html += `<h2 class="group">${esc(g)}</h2>`;
    for (const f of fs) {
      n++;
      html += `<article class="flow" id="${f.id}"><div class="flow-head"><span class="mono">${f.id}</span><h3>${esc(f.name)}</h3>${modeChip(f.mode)}<span class="goal">${esc(f.goal)}</span></div>`;
      html += `<div class="chips">${f.features.map(chipF).join("")}</div><div class="strip">`;
      f.steps.forEach((s, i) => {
        if (i) html += `<div class="arrow" aria-hidden="true">→</div>`;
        html += `<div class="step${q && match(s.text, s.screen) ? " hit" : ""}">${img(s.shot, `${f.id} step ${i + 1}: ${s.text}`)}<div class="num">${i + 1} · ${chipS(s.screen)} ${esc(S[s.screen]?.name || "")}</div><div class="cap">${esc(s.text)}</div></div>`;
      });
      html += `</div></article>`;
    }
  }
  return n ? html : `<p class="empty">No flow matches.</p>`;
}

function screens() {
  const list = DATA.screens.filter(s => modeOk(s.mode) && match(s.id, s.name, s.qml, s.reached));
  if (!list.length) return `<p class="empty">No screen matches.</p>`;
  let html = `<p class="intro">The ${DATA.screens.length} screens, by canonical name and QML file. Picture = first phone shot of that screen in any flow.</p><div class="grid">`;
  for (const s of list) {
    html += `<article class="scr" id="${s.id}">${img(s.shots[0], `${s.id} ${s.name}`)}<div class="meta"><span class="mono">${s.id}</span><h3>${esc(s.name)}</h3>${modeChip(s.mode)}<span class="mono">${esc(s.qml)}</span><span>From: ${esc(s.reached)}</span>`;
    html += s.flows.length ? `<div class="chips">${s.flows.map(chipFL).join("")}</div>` : `<span class="chip w">in no flow yet</span>`;
    if (s.shots.length > 1) html += `<span class="more">${s.shots.length} shots across flows</span>`;
    html += `</div></article>`;
  }
  return html + `</div>`;
}

function features() {
  const list = DATA.features.filter(f => modeOk(f.mode) && match(f.id, f.name, f.what, f.entry, f.proof, f.code, f.area));
  if (!list.length) return `<p class="empty">No feature matches.</p>`;
  const withShot = DATA.features.filter(f => f.shot).length;
  let html = `<p class="intro">Each feature: how a person reaches it (<b>entry</b>) and what on screen proves it worked (<b>proof</b>). Right columns map it to flows and screens. <b>${withShot}</b> of ${DATA.features.length} have a phone shot as proof.</p><div class="ftable"><table><thead><tr><th>ID</th><th>Feature</th><th>Entry → proof</th><th>Flows</th><th>Screens</th><th>Shot</th></tr></thead><tbody>`;
  let area = "";
  for (const f of list) {
    if (f.area !== area) { area = f.area; html += `<tr class="area"><td colspan="6">${esc(area)}</td></tr>`; }
    html += `<tr class="feat" id="${f.id}"><td class="id">${chipF(f.id)}</td><td><b>${esc(f.name)}</b>${isB(f.mode) ? ' <span class="chip b">bridge</span>' : ""}<div class="sub">${esc(f.what)}</div>${f.code ? `<div class="sub mono">${esc(f.code)}</div>` : ""}</td>`;
    html += `<td>${f.entry ? "Entry: " + esc(f.entry) : '<span class="sub">—</span>'}${f.proof ? `<div class="sub">Proof: ${esc(f.proof)}</div>` : ""}</td>`;
    html += `<td><div class="chips">${f.flows.map(chipFL).join("") || '<span class="chip w">none</span>'}</div></td><td><div class="chips">${f.screens.map(chipS).join("")}</div></td>`;
    html += `<td class="cov ${f.shot ? "y" : "n"}">${f.shot ? "yes" : "no"}</td></tr>`;
  }
  return html + `</tbody></table></div>`;
}

function render(scrollTo) {
  for (const v of ["flows", "screens", "features"]) {
    const el = $("#v-" + v);
    el.hidden = v !== view;
    if (v === view) el.innerHTML = {flows, screens, features}[v]();
  }
  document.querySelectorAll("nav.views a").forEach(a => a.setAttribute("aria-current", a.dataset.view === view ? "page" : "false"));
  if (scrollTo) {
    const t = document.getElementById(scrollTo);
    if (t) { t.classList.add("target"); t.scrollIntoView({block: "start"}); setTimeout(() => t.classList.remove("target"), 2400); }
  } else window.scrollTo(0, 0);
}

function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (/^FL-/.test(h)) { view = "flows"; render(h); }
  else if (/^SCR-/.test(h)) { view = "screens"; render(h); }
  else if (/^F-/.test(h)) { view = "features"; render(h); }
  else { view = ["screens", "features"].includes(h) ? h : "flows"; render(); }
}
addEventListener("hashchange", route);
$("#q").addEventListener("input", e => { q = e.target.value.trim().toLowerCase(); render(); });
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  mode = b.dataset.mode;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  render();
}));
document.addEventListener("click", e => {
  const im = e.target.closest(".phone img");
  if (!im) return;
  $("#lbimg").src = im.src; $("#lbcap").textContent = im.dataset.cap;
  $("#lb").showModal();
});
$("#lb").addEventListener("click", () => $("#lb").close());
$("#foot").textContent = "Source: " + DATA.source + ". IDs match feature-map.md, flows.md and mapping.md in the project files.";
route();
</script>

</html>
