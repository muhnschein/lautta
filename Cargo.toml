[workspace]
resolver = "2"
members = [
    "crates/lautta-core",
    "crates/lautta-bridge-proto",
    "crates/lautta-pdf",
    "crates/lautta-qt",
    "crates/harbour-lautta",
]
default-members = ["crates/lautta-core", "crates/lautta-bridge-proto", "crates/lautta-pdf"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "LGPL-2.1-or-later"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Small build folders.
[profile.dev]
debug = "line-tables-only"
incremental = false

# Text viewer grammars run regexes here; unoptimised too slow for host tests and emulated target.
[profile.dev.package.syntect]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3

# Unwind: PDF tripping the renderer fails that draw, not the app. Other panics abort via
# `lautta_core::panics` hook.
[profile.release]
panic = "unwind"
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
debug = false

# qttypes 0.2.12 links QtWidgets unconditionally; Harbour forbids it. third_party/qttypes puts the
# link behind a feature.
[patch.crates-io]
qttypes = { path = "third_party/qttypes" }
