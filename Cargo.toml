[workspace]
resolver = "2"
members = [
    "crates/lautta-core",
    "crates/lautta-bridge-proto",
    "crates/lautta-pdf",
    "crates/lautta-qt",
    "crates/harbour-lautta",
]
default-members = ["crates/lautta-core", "crates/lautta-bridge-proto", "crates/lautta-pdf"]

[workspace.package]
version = "1.1.0"
edition = "2021"
rust-version = "1.95"
license = "LGPL-2.1-or-later"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package.syntect]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3

[profile.dev.package.zlib-rs]
opt-level = 3

[profile.release]
panic = "unwind"
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
debug = false

[patch.crates-io]
cpp_common = { path = "third_party/cpp_common" }
qttypes = { path = "third_party/qttypes" }
