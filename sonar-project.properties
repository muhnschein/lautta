sonar.projectKey=muhnschein_lautta
sonar.organization=muhnschein


sonar.projectName=lautta
sonar.projectVersion=1.0.0


sonar.sources=crates,qml,tools
sonar.tests=crates,tools
sonar.test.inclusions=crates/*/tests/**,tools/*_test.py
sonar.exclusions=crates/*/tests/**,**/target/**,tools/*_test.py,translations/**

sonar.sourceEncoding=UTF-8

sonar.rust.lcov.reportPaths=coverage/lcov.info
sonar.rust.clippy.reportPaths=coverage/clippy.json
sonar.python.coverage.reportPaths=coverage/python.xml

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
