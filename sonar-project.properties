sonar.projectKey=muhnschein_lautta
sonar.organization=muhnschein


sonar.projectName=lautta
sonar.projectVersion=0.1.0


sonar.sources=crates,qml,tools
sonar.tests=crates
sonar.test.inclusions=crates/*/tests/**
sonar.exclusions=crates/*/tests/**,**/target/**

sonar.sourceEncoding=UTF-8

# Rust: coverage from cargo-llvm-cov, clippy findings (make coverage / make clippy-report).
sonar.rust.lcov.reportPaths=coverage/lcov.info
sonar.rust.clippy.reportPaths=coverage/clippy.json

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
